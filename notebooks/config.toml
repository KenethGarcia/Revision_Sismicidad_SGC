name = "Incorrect magnitude type for zone3"
logic = "and"

    [[checks.conditions]]
    rule_type = "category"
    column = "event_type"
    mode = "not_in"
    value = ["not existing", "not locatable"]

    [[checks.groups]]
    logic = "xor"
    description = "Correspondence between zone3 and magnitude MLr_3"

        [[checks.groups.conditions]]
        rule_type = "polygon"
        lat_col = "latitude_value"
        lon_col = "longitude_value"
        mode = "inside"
        polygon = "zone3"

        [[checks.groups.conditions]]
        rule_type = "category"
        column = "magnitude_type"
        mode = "in"
        value = "MLr_3"

    # Part 3: Not a DESTACADO event with magnitude Mw
    [[checks.groups]]
    logic = "and"
    negate = true
    description = "Not a DESTACADO event with magnitude Mw"

        [[checks.groups.conditions]]
        rule_type = "category"
        column = "comment"
        mode = "in"
        value = "DESTACADO"

        [[checks.groups.conditions]]
        rule_type = "category"
        column = "magnitude_type"
        mode = "in"
        value = "Mw"

