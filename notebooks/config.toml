# ──────────────────────────────────────────────────────────────
# Checks configuration
# ──────────────────────────────────────────────────────────────

# 1. Events with high RMS (1.50)
[[checks]]
name = "High RMS"
event_type = ["earthquake"]

  [[checks.conditions]]
  rule_type = "numeric"
  column = "quality_standardError"
  mode = "gt"
  threshold = 1.50

# 2. Events with high latitude uncertainty (>12 km)
[[checks]]
name = "High Latitude Uncertainty"
event_type = ["earthquake", "explosion", "volcanic eruption"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "latitude_uncertainty"
    mode = "gt"
    threshold = 12

# 3. Events with high longitude uncertainty (>12 km)
[[checks]]
name = "High Longitude Uncertainty"
event_type = ["earthquake", "explosion", "volcanic eruption"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "longitude_uncertainty"
    mode = "gt"
    threshold = 12

# 4. Events with high depth uncertainty (>12 km)
[[checks]]
name = "High Depth Uncertainty"
event_type = ["earthquake"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "depth_uncertainty"
    mode = "gt"
    threshold = 12

# 5. Locatable events with anomalous labeling
[[checks]]
name = "Locatable event"
event_type = "not locatable"
logic = "or"

    # Group 1: Conditions for events with time_value >= 2026-03-17 00:00:00
    [[checks.groups]]
    logic = "and"
    description = "Locatable events in sc6 (time_value >= 2026-03-17 00:00:00)"

        [[checks.groups.conditions]]
        rule_type = "temporal"
        column = "time_value"
        mode = "ge"
        value = "2026-03-17 00:00:00"

        [[checks.groups.conditions]]
        rule_type = "numeric"
        column = "quality_usedStationCount"
        mode = "ge"
        threshold = 4.0

        [[checks.groups.conditions]]
        rule_type = "column_column"
        left_col = "quality_associatedPhaseCount"
        right_col = "quality_usedStationCount"
        mode = "ge"
        offset = 2.0

    # Group 2: Conditions for events with time_value < 2026-03-17 00:00:00
    [[checks.groups]]
    logic = "and"
    description = "Conditions for events with time_value < 2026-03-17 00:00:00"

        [[checks.groups.conditions]]
        rule_type = "temporal"
        column = "time_value"
        mode = "lt"
        value = "2026-03-17 00:00:00"

        [[checks.groups.conditions]]
        rule_type = "numeric"
        column = "quality_associatedPhaseCount"
        mode = "ge"
        threshold = 8.0

# 6. Events with invalid labeling
[[checks]]
name = "Invalid label"

    [[checks.conditions]]
    rule_type = "category"
    column = "event_type"
    mode = "not_in"
    values = ["earthquake", "not locatable", "volcanic eruption", "explosion", "not existing", "outside of network interest"]

# 7. Events with negative depth values
[[checks]]
name = "Negative Depth"
event_type = ["earthquake", "explosion", "volcanic eruption", "not locatable", "outside of network interest"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "depth_value"
    mode = "lt"
    threshold = 0

# 8. Events with unreal high depth values (>=200 km)
[[checks]]
name = "Noncommon High Depth"
event_type = ["earthquake", "explosion", "volcanic eruption"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "depth_value"
    mode = "ge"
    threshold = 200

# 9. Events with less than 3 stations used or associated (only works at SC6)
[[checks]]
name = "Earthquake with 3 or fewer stations associated/picked"
event_type = ["earthquake", "volcanic eruption", "outside of network interest"]
logic = "and"

    # 9.1. Temporal condition for events in SC6
    [[checks.conditions]]
    rule_type = "temporal"
    column = "time_value"
    mode = "ge"
    value = "2026-03-17T00:00:00Z"

    [[checks.groups]]
    logic = "or"
    description = "Conditions for earthquakes with 3 or less stations picked/associated"

        # 9.2. Condition for earthquakes with 3 or fewer stations picked
        [[checks.groups.conditions]]
        rule_type = "numeric"
        column = "quality_usedStationCount"
        mode = "le"
        threshold = 3

        # 9.3. Condition for earthquakes with 3 or fewer associated phases
        [[checks.groups.conditions]]
        rule_type = "numeric"
        column = "quality_associatedPhaseCount"
        mode = "le"
        threshold = 3

# 10. Events not processed by the network
[[checks]]
name = "Unprocessed or unassociated event"
logic= "and"

    [[checks.conditions]]
    rule_type = "category"
    column = "event_type"
    mode = "not_in"
    values = ["not existing"]

    [[checks.conditions]]
    rule_type = "category"
    column = "creationInfo_agencyID"
    mode = "in"
    values = ["SGC"]

    [[checks.conditions]]
    rule_type = "category"
    column = "creationInfo_author"
    mode = "in"
    values = ["scanloc", "scautoloc_reg", "scanlocbay", "AI_picker", "scautoloc2@sc-principal", "scanloc_b", "scanlocbay"]

# 11. Pacific or Caribbean events with high depth (> 30 km)
[[checks]]
name = "Pacific/Caribbean event with high depth"
logic = "and"
event_type = ["earthquake", "outside of network interest"]

    [[checks.conditions]]
    rule_type = "numeric"
    column = "depth_value"
    mode = "gt"
    threshold = 30

    [[checks.conditions]]
    rule_type = "polygon"
    lat_col = "latitude_value"
    lon_col = "longitude_value"
    mode = "inside"
    polygon = ["pacifico", "caribe"]

# 12. Events inside local zone without correct labeling
# The event is inside the local zone and event_type is "outside of network interest".
[[checks]]
name = "Event inside local zone with outside label"
logic= "and"

    [[checks.conditions]]
    rule_type = "polygon"
    lat_col = "latitude_value"
    lon_col = "longitude_value"
    mode = "inside"
    polygon = "local_area"

    [[checks.conditions]]
    rule_type = "category"
    column = "event_type"
    mode = "in"
    values = ["outside of network interest"]

# 13. Events outside local zone with incorrect labeling
# The event is outside the local zone and event_type is NOT outside of network interest or not locatable or not existing
[[checks]]
name = "Event outside local zone with incorrect label"
logic= "and"

    [[checks.conditions]]
    rule_type = "polygon"
    lat_col = "latitude_value"
    lon_col = "longitude_value"
    mode = "outside"
    polygon = "local_area"

    [[checks.conditions]]
    rule_type = "category"
    column = "event_type"
    mode = "not_in"
    values = ["outside of network interest", "not locatable", "not existing"]